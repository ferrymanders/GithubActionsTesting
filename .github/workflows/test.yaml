name: test functions
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: nosdigital/dnsloadbalancer
  APP_ID: ${{ vars.IMAGE_UPDATER_APP_ID }}
  FILES: [ cluster/apps/dnsloadbalancer/env/prod/kustomization.yaml, foo/bar/file.yaml ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: test
        run: |
          for FILE in $FILES;
          do
            echo "# --> $FILE";
          done
